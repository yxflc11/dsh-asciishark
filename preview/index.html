<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ASCII sharks — DSH background preview</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05070b; }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        font-family: "Geist Mono", ui-monospace, Menlo, monospace;
      }
      .hint {
        position: fixed;
        left: 18px;
        bottom: 14px;
        font: 12px/1.4 ui-monospace, Menlo, monospace;
        color: rgba(190, 212, 255, 0.55);
        pointer-events: none;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <canvas aria-hidden="true"></canvas>
    <div class="hint">ascii-sharks · stackedlol/ascii-sharks · 8 species · move the pointer, click to splash</div>
    <script src="./ocean.global.js"></script>
    <script>
      new window.OceanEngine(document.querySelector("canvas"), [
        { kind: "hammerhead", size: 0.9 },
        { kind: "classic", size: 0.82 },
        { kind: "tiger", size: 0.74 },
        { kind: "greathammer", size: 0.66 },
        { kind: "thresher", size: 0.58 },
        { kind: "mako", size: 0.52 },
        { kind: "nurse", size: 0.46 },
        { kind: "zebra", size: 0.42 },
      ]);
    </script>
  </body>
</html>
